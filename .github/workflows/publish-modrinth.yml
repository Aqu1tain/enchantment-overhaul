name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # gradle.properties pins org.gradle.java.home to a local macOS path; drop it so the CI JDK is used.
      - name: Use the CI JDK
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Resolve version
        id: ver
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: iPA46eKp
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources).jar
          name: Enchantment Overhaul ${{ steps.ver.outputs.value }}
          version: ${{ steps.ver.outputs.value }}
          version-type: beta
          loaders: fabric
          game-versions: |
            26.1
            26.1.1
            26.1.2
          dependencies: |
            fabric-api(required)
